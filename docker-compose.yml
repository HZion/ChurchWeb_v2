version: '3.8'

services:
  # ASP.NET Core 애플리케이션
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churchweb-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=${DB_CONNECTION_STRING}
    ports:
      - "5000:8080"
    depends_on:
      - postgres
    networks:
      - churchweb-network
    volumes:
      - ./src/ChurchWeb.Web/wwwroot/uploads:/app/wwwroot/uploads
    restart: unless-stopped

  # PostgreSQL 데이터베이스 (로컬 개발용 - 선택사항)
  postgres:
    image: postgres:16
    container_name: churchweb-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-churchweb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - churchweb-network
    restart: unless-stopped
    # 외부 포트 노출 안 함 (보안)

  # Nginx 리버스 프록시
  nginx:
    image: nginx:1.27
    container_name: churchweb-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - churchweb-network
    restart: unless-stopped

networks:
  churchweb-network:
    driver: bridge

volumes:
  postgres-data:
